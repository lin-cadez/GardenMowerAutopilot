<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RC Mower Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:sans-serif}
#map{height:100vh}
.panel{
 position:absolute;top:10px;left:10px;background:#fff;padding:10px;
 border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.2)
}
button{margin:4px;padding:8px}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<button onclick="post('/perimeter/start')">Start perimeter</button>
<button onclick="post('/perimeter/stop')">Stop perimeter</button>
<button onclick="post('/guidance/on')">Guidance ON</button>
<button onclick="post('/guidance/off')">Guidance OFF</button>
<div id="info"></div>
</div>

<script>
const map=L.map("map").setView([46.1,14.0],18);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
const marker=L.marker([46.1,14.0]).addTo(map);
let poly=null,rings=[];

async function api(p){return (await fetch(p,{method:p.startsWith("/state")?"GET":"POST"})).json()}
async function post(p){await api(p)}

async function upd(){
 const s=await api("/state");
 if(s.latest.lat){
  marker.setLatLng([s.latest.lat,s.latest.lon]);
  map.panTo(marker.getLatLng(),{animate:true});
 }
 if(s.perimeter.polygon.length){
  if(poly)map.removeLayer(poly);
  poly=L.polygon(s.perimeter.polygon,{color:"red",fillOpacity:.3}).addTo(map);
 }
 rings.forEach(r=>map.removeLayer(r)); rings=[];
 s.perimeter.rings.slice(0,8).forEach(r=>rings.push(L.polyline(r).addTo(map)));
 document.getElementById("info").innerText=
  `Fix: ${s.latest.fix_text||"-"}  Area: ${s.perimeter.area_m2.toFixed(1)} m²`;
}
setInterval(upd,500);
upd();
</script>
</body>
</html>
