<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mower Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin:0; font-family: system-ui, Arial, sans-serif; }
    #map { height: 78vh; }
    #bar {
      padding: 10px;
      display:flex;
      gap:10px;
      flex-wrap: wrap;
      align-items: center;
      border-top: 1px solid #ddd;
    }
    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #f7f7f7;
      cursor: pointer;
    }
    button:hover { background:#efefef; }
    .pill {
      padding: 6px 10px; border-radius: 999px; background:#eee;
      font-size: 13px;
    }
    .warn { background: #ffe3e3; }
    .ok { background: #e4ffe8; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="bar">
    <button onclick="post('/perimeter/start')">Start Perimeter</button>
    <button onclick="post('/perimeter/stop')">Stop + Build Polygon</button>
    <button onclick="post('/autonomy/start')">Start Autonomous</button>
    <button onclick="post('/autonomy/stop')">Stop Autonomous</button>

    <span id="armed" class="pill">Armed: ?</span>
    <span id="auto" class="pill">Autonomy: ?</span>
    <span id="fix" class="pill">Fix: ?</span>
    <span id="area" class="pill">Area: ?</span>
    <span id="safety" class="pill">Safety: ?</span>
  </div>

  <script>
    const map = L.map('map').setView([46.05, 14.5], 18);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 20, attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let posMarker = null;
    let polyLayer = null;
    let ringLayers = [];

    function setPill(id, text, cls) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = "pill " + (cls || "");
    }

    async function post(path) {
      const r = await fetch(path, { method: "POST" });
      const j = await r.json().catch(()=>({ok:false,error:"bad json"}));
      if (!j.ok && j.error) alert(j.error);
    }

    function clearRings() {
      for (const l of ringLayers) map.removeLayer(l);
      ringLayers = [];
    }

    async function tick() {
      const r = await fetch("/state");
      const s = await r.json();

      // UI pills
      setPill("armed", `Armed (CH5): ${s.autopilot_armed}`, s.autopilot_armed ? "ok" : "warn");
      setPill("auto", `Autonomy active: ${s.guidance.active}`, s.guidance.active ? "warn" : "ok");
      setPill("fix", `Fix: ${s.latest.fix_text || "?"}`);
      setPill("area", `Area: ${s.perimeter.area_m2 ? s.perimeter.area_m2.toFixed(1) + " m²" : "?"}`);
      setPill("safety", `Target detected: ${s.target_detected}`, s.target_detected ? "warn" : "ok");

      // Position marker
      const lat = s.latest.lat, lon = s.latest.lon;
      if (lat && lon) {
        const ll = [lat, lon];
        if (!posMarker) {
          posMarker = L.circleMarker(ll, { radius: 7 }).addTo(map);
          map.setView(ll, 19);
        } else {
          posMarker.setLatLng(ll);
        }
      }

      // Red filled polygon
      if (polyLayer) map.removeLayer(polyLayer);
      const poly = s.perimeter.polygon || [];
      if (poly.length >= 3) {
        polyLayer = L.polygon(poly, {
          fill: true,
          fillOpacity: 0.25,
          color: "#ff0000",
          weight: 2
        }).addTo(map);
      }

      // Rings
      clearRings();
      const rings = s.perimeter.rings || [];
      for (let i=0; i<rings.length; i++) {
        const ring = rings[i];
        if (ring.length < 3) continue;
        const isOuter = (i === 0);
        const line = L.polyline(ring, {
          weight: isOuter ? 4 : 2,
          opacity: isOuter ? 0.9 : 0.6
        }).addTo(map);
        ringLayers.push(line);
      }
    }

    setInterval(tick, 400);
    tick();
  </script>
</body>
</html>
